name: Capture portfolio screenshots

on:
  push:
    paths:
      - ".github/workflows/capture-portfolio-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start TempCheck
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/tempcheck.log 2>&1 &
          echo $! > /tmp/tempcheck.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("TempCheck did not start")
          PY

      - name: Capture complete application workflow
        run: |
          mkdir -p assets/screenshots
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:8000"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1000},
                  device_scale_factor=1,
              )

              screens = [
                  ("/", "tempcheck-dashboard.png"),
                  ("/entregas/nueva", "tempcheck-new-delivery.png"),
                  ("/entregas/3", "tempcheck-risk-detail.png"),
                  ("/entregas/3/editar", "tempcheck-edit-delivery.png"),
                  ("/entregas/3/resumen", "tempcheck-summary.png"),
              ]

              for route, filename in screens:
                  page.goto(base + route, wait_until="networkidle")
                  page.screenshot(
                      path=f"assets/screenshots/{filename}",
                      full_page=True,
                  )

              browser.close()
          PY

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/tempcheck-*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: capture full TempCheck screen set"
            git push
          fi
