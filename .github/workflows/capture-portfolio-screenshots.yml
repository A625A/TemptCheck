name: Capture portfolio screenshots

on:
  push:
    paths:
      - ".github/workflows/capture-portfolio-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start TempCheck
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/tempcheck.log 2>&1 &
          echo $! > /tmp/tempcheck.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("TempCheck did not start")
          PY

      - name: Capture real application screenshots
        run: |
          mkdir -p assets/screenshots
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8000/", wait_until="networkidle")
              page.screenshot(path="assets/screenshots/tempcheck-dashboard.png", full_page=True)

              page.goto("http://127.0.0.1:8000/entregas/3", wait_until="networkidle")
              page.screenshot(path="assets/screenshots/tempcheck-risk-detail.png", full_page=True)
              browser.close()
          PY

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/tempcheck-dashboard.png assets/screenshots/tempcheck-risk-detail.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "docs: add real TempCheck screenshots"
            git push
          fi
